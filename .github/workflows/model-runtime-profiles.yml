name: Model runtime profile contracts

on:
  pull_request:
    paths:
      - runtime/**
      - tools/jovian_wheel_runtime/prepare_runtime_foundation.py
      - tools/jovian_wheel_runtime/build_runtime_image.py
      - tools/jovian_wheel_runtime/Dockerfile.runtime
      - tools/jovian_wheel_runtime/tests/test_runtime_foundation.py
      - tools/jovian_wheel_runtime/tests/test_runtime_dockerfile.py
      - recipes/glm53/serve-*.sh
      - .github/workflows/model-runtime-profiles.yml
  push:
    branches: [main]
    paths:
      - runtime/**
      - tools/jovian_wheel_runtime/prepare_runtime_foundation.py
      - tools/jovian_wheel_runtime/build_runtime_image.py
      - tools/jovian_wheel_runtime/Dockerfile.runtime
      - tools/jovian_wheel_runtime/tests/test_runtime_foundation.py
      - tools/jovian_wheel_runtime/tests/test_runtime_dockerfile.py
      - recipes/glm53/serve-*.sh
      - .github/workflows/model-runtime-profiles.yml

permissions:
  contents: read

jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m venv .venv-profile-tests
          .venv-profile-tests/bin/pip install -r runtime/requirements.txt pytest ruff
          .venv-profile-tests/bin/python -m pytest -q runtime/tests
          .venv-profile-tests/bin/python -m pytest -q tools/jovian_wheel_runtime/tests/test_runtime_foundation.py tools/jovian_wheel_runtime/tests/test_runtime_dockerfile.py
          .venv-profile-tests/bin/ruff check runtime
          .venv-profile-tests/bin/ruff format --check runtime
          bash -n runtime/lil-serve runtime/install.sh
