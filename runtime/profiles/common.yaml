schema_version: 1
kind: common
id: single-node-vllm
status: implemented
defaults:
  cache-transfer-mode: engine_driven
  cache-l1-gib: 24
  cache-l1-init-gib: 2
  cache-l2-gib: 256
  cache-l2-enabled: false
  cache-cpu-workers: 4
  cache-l2-workers: 4
  cache-directory: /cache/lmcache
  cache-object-tokens: 4096
  cache-native-gib: 64
  cache-host: 127.0.0.1
  cache-http-host: 127.0.0.1
  cache-start-timeout: 120
  cache-prefetch-policy: retain
  cache-broker-directory: /cache/lmcache-cumem
  cache-load-failure-policy: recompute
  host: 0.0.0.0
  port: 8000
  pipeline-parallel-size: 1
  decode-context-parallel-size: 1
  dtype: bfloat16
  kv-cache-dtype: fp8
  load-format: instanttensor
  enable-prefix-caching: true
  enable-prompt-tokens-details: true
  enable-chunked-prefill: true
  enable-auto-tool-choice: true
  cache-mode: vram
environment:
  # Checkpoints and saved credentials must not inherit the runtime-keyed JIT root.
  HF_HOME: /root/.cache/huggingface
  CUDA_DEVICE_ORDER: PCI_BUS_ID
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  VLLM_USE_V2_MODEL_RUNNER: "1"
  SAFETENSORS_FAST_GPU: "1"
  INSTANTTENSOR_BACKEND: BUFFERED
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
