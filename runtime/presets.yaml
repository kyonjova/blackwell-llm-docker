schema_version: 1
presets:
  glm53-tp2:
    profile: glm53-flash
    hardware: rtx-pro-6000-pcie
    description: The default TP2 recipe for GLM-5.3-Flash on two 96-GB RTX PRO GPUs. It serves the QAD weights from the stored checkpoint GLM-5.3-Flash-NVFP4-MXFP8-CSF-QAD (MXFP8 attention and shared experts, NVFP4 routed experts with losslessly compressed scales). The routed experts decode with BF16 activations and FP32 router weights and prefill with NVFP4 activations. It runs TP2/DCP2, MTP3 with B12X drafter experts, eight request slots, a 4096-token prefill budget and a 7,296 MiB KV cache per GPU (about 1.84M tokens), and LMCache keeps the prefix cache in up to 64 GiB of host RAM as well. The input embedding table lives in host RAM and the vision tower is quantized to MXFP8 while loading.
    options:
      # Stored QAD checkpoint in FP4-CSF form; CHECKPOINT=original does not apply.
      model: local-inference-lab/GLM-5.3-Flash-NVFP4-MXFP8-CSF-QAD
      revision: 4f90b74165cb1542cca35730b7dfa4d550bcf0ce
      quantization: nvfp4_csf
      load-format: nvfp4_csf
      served-model-name: GLM-5.3-Flash
      tensor-parallel-size: 2
      decode-context-parallel-size: 2
      mode: mtp
      max-model-len: -1
      max-num-seqs: 8
      # One 4096-token LMCache object fills one 2048-token page per DCP rank,
      # the capacity-efficient page (3072 would give 1536-token pages and 9%
      # fewer KV tokens), and prefills 32K prompts about 5% faster.
      max-num-batched-tokens: 4096
      cache-object-tokens: 4096
      # Qualified with LMCache: eight streams mixing 1K-168K-token prompts
      # with up to ten images of 6000x4000, then eight agents growing past
      # 450K tokens each, left 499 MiB per GPU free at the worst peak.
      kv-cache-memory-bytes: 7650410496
      gpu-memory-utilization: 0.985
      # auto: 32 verifier rows at eight slots (MTP3 verifies four per request).
      max-cudagraph-capture-size: auto
      cudagraph-capture-sizes: [1, 2, 4, 8, 12, 16, 20, 24, 28, 32]
      expert-activations: bf16
      router-weights: fp32
      # Prefill rows on NVFP4 activations, decode on W4A16.
      prefill-activations: a4
      # Prefix cache in GPU memory and host RAM; the disk tier is opt-in.
      cache-mode: lmcache
      cache-l2-enabled: false
    environment:
      VLLM_PCIE_TWOSHOT_ALLREDUCE_MAX_SIZE: "off"
      # Prefill all-reduces (33 MB per 4,096-token chunk) go through the b12x
      # PCIe DMA all-reduce: prefill +2 to +3% with a16 and +4 to +6% with a4,
      # decode unchanged. More NCCL channels are faster still but do not fit
      # the 0.985 memory budget at startup.
      VLLM_PCIE_DMA_MIN_BYTES: 6MB
      NCCL_SOCKET_IFNAME: lo
      GLOO_SOCKET_IFNAME: lo
      NCCL_MIN_NCHANNELS: "2"
      NCCL_MAX_NCHANNELS: "2"
      NCCL_BUFFSIZE: "1048576"
      NCCL_NET_PLUGIN: none
      NCCL_TUNER_PLUGIN: none
      CUBLAS_WORKSPACE_CONFIG: ":4096:1"
      OMP_NUM_THREADS: "1"
      VLLM_B12X_MLA_CKV_GATHER_MAX_TOKENS: "65536"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True,large_segment_size_mb:12
      VLLM_GLM53_EMBED_HOST: "1"
      # The checkpoint stores the vision tower in BF16.
      VLLM_GLM53_VISION_MXFP8: "1"
      VLLM_SHARE_PYNCCL_COMMS: "1"
    modes:
      mtp:
        config: {moe_backend: b12x}
    linked_options:
      cache-object-tokens: max-num-batched-tokens
    # Working memory per request slot above eight, carried over from the
    # Spark TP2 measurements. The KV size above already leaves room for the
    # LMCache connector's GPU buffers, so CACHE_MODE=vram keeps it as is.
    kv_bytes_per_extra_slot: 67108864
  glm53-tp3:
    profile: glm53-flash
    hardware: rtx-pro-6000-pcie
    description: GLM-5.3-Flash on three 96-GB RTX PRO GPUs with TP3, expert parallelism and MTP3. Attention heads are padded for TP3, the vision tower runs data-parallel, and large dense projections decode in FP8. VRAM prefix cache only.
    options:
      # FP4-CSF experts need B12X without expert parallelism.
      checkpoint: original
      tensor-parallel-size: 3
      enable-expert-parallel: true
      moe-backend: flashinfer_cutlass
      enable-flashinfer-autotune: true
      mode: mtp
      max-num-seqs: 8
      max-cudagraph-capture-size: 32
      cudagraph-capture-sizes: [1, 2, 4, 8, 12, 16, 20, 24, 28, 32]
      additional-config: {glm53_kda_decode_backend: b12x, kda_prefill_backend: flashkda}
    environment:
      VLLM_PCIE_ONESHOT_ALLREDUCE_MAX_SIZE: 256KB
      VLLM_GLM53_L2_PREFETCH_BUDGET_A_MB: "10"
      VLLM_GLM53_L2_PREFETCH_BUDGET_B_MB: "25"
      VLLM_GLM53_L2_PREFETCH_BUDGET_C_MB: "7.5"
      VLLM_GLM53_L2_PREFETCH_BUDGET_A_MLA_MB: "18"
      VLLM_GLM53_FP8_DENSE: "1"
      VLLM_GLM53_FP8_PREFILL: w8a8
    modes: {}
    linked_options: {}
  qwen38-tp2:
    profile: qwen38-flash-next
    hardware: rtx-pro-6000-pcie
    description: Qwen3.8 Flash Next on two GPUs, retaining the model profile's MTP, table-offload and attention defaults.
    options:
      tensor-parallel-size: 2
    environment: {}
    modes: {}
    linked_options: {}
  qwen38-tp1x2:
    profile: qwen38-flash-next
    hardware: rtx-pro-6000-pcie
    description: Qwen3.8 Flash Next as two TP1 replicas on two GPUs behind one endpoint that keeps each conversation on one replica. The replicas share one host-RAM PLE table and, with an external cache, one LMCache service.
    options:
      replicas: 2
    environment: {}
    modes: {}
    linked_options: {}
  mimo26-flash-tp2:
    profile: mimo26-flash
    hardware: rtx-pro-6000-pcie
    description: MiMo-V2.6-Flash-RL on two 96-GB RTX PRO GPUs with DFlash 7 and adaptive verification, FP8 KV and the full 1M context. Images and audio work; video input is off because its encoder profile would take most of the KV cache at TP2.
    options:
      tensor-parallel-size: 2
      gpu-memory-utilization: 0.985
      limit-mm-per-prompt: {video: 0}
    environment: {}
    modes: {}
    linked_options: {}
