schema_version: 1
presets:
  glm53-tp2:
    profile: glm53-flash
    hardware: rtx-pro-6000-pcie
    description: The default TP2 recipe for GLM-5.3-Flash on two 96-GB RTX PRO GPUs. It serves the QAD weights from the stored checkpoint GLM-5.3-Flash-NVFP4-MXFP8-CSF-QAD (MXFP8 attention and shared experts, NVFP4 routed experts with losslessly compressed scales). The routed experts decode with BF16 activations and FP32 router weights and prefill with NVFP4 activations. It runs TP2/DCP2, MTP3 with B12X drafter experts, eight request slots, a 4096-token prefill budget and a 7,296 MiB KV cache per GPU (about 1.84M tokens), and LMCache keeps the prefix cache in up to 64 GiB of host RAM as well. The input embedding table lives in host RAM and the vision tower is quantized to MXFP8 while loading.
    options:
      # Stored QAD checkpoint in FP4-CSF form; CHECKPOINT=original does not apply.
      model: local-inference-lab/GLM-5.3-Flash-NVFP4-MXFP8-CSF-QAD
      revision: fd660d51d1fc3caae26a4bf31b7451475bbb9bdc
      quantization: nvfp4_csf
      load-format: nvfp4_csf
      served-model-name: GLM-5.3-Flash
      tensor-parallel-size: 2
      decode-context-parallel-size: 2
      mode: mtp
      max-model-len: -1
      max-num-seqs: 8
      # One 4096-token LMCache object fills one 2048-token page per DCP rank,
      # the capacity-efficient page (3072 would give 1536-token pages and 9%
      # fewer KV tokens), and prefills 32K prompts about 5% faster.
      max-num-batched-tokens: 4096
      cache-object-tokens: 4096
      # Qualified with LMCache: eight streams mixing 1K-168K-token prompts
      # with up to ten images of 6000x4000, then eight agents growing past
      # 450K tokens each, left 499 MiB per GPU free at the worst peak.
      kv-cache-memory-bytes: 7650410496
      gpu-memory-utilization: 0.985
      # auto: 32 verifier rows at eight slots (MTP3 verifies four per request).
      max-cudagraph-capture-size: auto
      cudagraph-capture-sizes: [1, 2, 4, 8, 12, 16, 20, 24, 28, 32]
      expert-activations: bf16
      router-weights: fp32
      # Prefill rows on NVFP4 activations, decode on W4A16.
      prefill-activations: a4
      # Prefix cache in GPU memory and host RAM; the disk tier is opt-in.
      cache-mode: lmcache
      cache-l2-enabled: false
    environment:
      VLLM_PCIE_TWOSHOT_ALLREDUCE_MAX_SIZE: "off"
      # Prefill all-reduces (33 MB per 4,096-token chunk) go through the b12x
      # PCIe DMA all-reduce: prefill +2 to +3% with a16 and +4 to +6% with a4,
      # decode unchanged. More NCCL channels are faster still but do not fit
      # the 0.985 memory budget at startup.
      VLLM_PCIE_DMA_MIN_BYTES: 6MB
      NCCL_SOCKET_IFNAME: lo
      GLOO_SOCKET_IFNAME: lo
      NCCL_MIN_NCHANNELS: "2"
      NCCL_MAX_NCHANNELS: "2"
      NCCL_BUFFSIZE: "1048576"
      NCCL_NET_PLUGIN: none
      NCCL_TUNER_PLUGIN: none
      CUBLAS_WORKSPACE_CONFIG: ":4096:1"
      OMP_NUM_THREADS: "1"
      VLLM_B12X_MLA_CKV_GATHER_MAX_TOKENS: "65536"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True,large_segment_size_mb:12
      VLLM_GLM53_EMBED_HOST: "1"
      # The checkpoint stores the vision tower in BF16.
      VLLM_GLM53_VISION_MXFP8: "1"
      VLLM_SHARE_PYNCCL_COMMS: "1"
    modes:
      mtp:
        config: {moe_backend: b12x}
    linked_options:
      cache-object-tokens: max-num-batched-tokens
    # Working memory per request slot above eight, carried over from the
    # Spark TP2 measurements. The KV size above already leaves room for the
    # LMCache connector's GPU buffers, so CACHE_MODE=vram keeps it as is.
    kv_bytes_per_extra_slot: 67108864
  glm53-csf-tp8:
    profile: glm53
    hardware: rtx-pro-6000-pcie
    description: GLM-5.3 (744B) on eight 96-GB RTX PRO GPUs with TP8 and MTP3 from the model's built-in layer, serving the FP4-CSF checkpoint GLM-5.3-NVFP4-CSF (NVFP4 routed experts with losslessly compressed scales) with its BF16 attention and shared experts quantized to MXFP8 while loading; the MTP layer drafts with NVFP4 experts and an NVFP4 copy of the vocabulary head. About 616K KV tokens at 92% of GPU memory; DCP=2 holds the full 1M context (about 1.19M tokens) at about 15% fewer decode steps. B12X runs the DSA sparse attention with IndexCache, the W4A16 routed experts and the fused PCIe all-reduce + RMSNorm, and attention weights are prefetched into L2 during decode. VRAM prefix cache only.
    options:
      model: local-inference-lab/GLM-5.3-NVFP4-CSF
      revision: a4d406932f2db96db8e852867c7939f448e0cd6f
      quantization: nvfp4_csf
      load-format: nvfp4_csf
      tensor-parallel-size: 8
      # The checkpoint keeps attention and the shared experts in BF16; MXFP8
      # while loading frees about 1.6 GiB per GPU and decodes faster.
      quantization-config:
        targets:
          model.layers.*.self_attn.*: mxfp8
          model.layers.*.mlp.shared_experts.*: mxfp8
    environment:
      # The MTP layer drafts with a W4A16 NVFP4 copy of the vocabulary head.
      VLLM_GLM53_MTP_DRAFT_HEAD: nvfp4
      # DCP > 1 exchanges queries and attention outputs over B12X PCIe and
      # gathers the compressed KV cache for prompts up to the full 1M context.
      VLLM_USE_B12X_DCP_A2A: "1"
      VLLM_B12X_MLA_CKV_GATHER_MAX_TOKENS: "1048576"
    modes:
      mtp:
        config:
          quantization_config:
            targets:
              model.layers.78.mlp.experts: nvfp4_a16
              model.layers.78.self_attn.*: mxfp8
              model.layers.78.mlp.shared_experts.*: mxfp8
    linked_options: {}
    # KV bytes per GPU at DCP > 1. At 92% of GPU memory a 1M-token prompt runs
    # DCP=2 out of memory (context-sized indexer and DCP buffers grow outside
    # vLLM's budget) and DCP=8 out of room for 64 concurrent 8K prefills.
    # Qualified with a 1,048,448-token prompt, then 64 concurrent 8K prompts,
    # then 4 minutes of 1K-96K prompts: at least 500 MiB stays free per GPU.
    kv_bytes_by_dcp:
      "2": 32480690176
      "8": 28991029248
  glm53-csf-tp6:
    profile: glm53
    hardware: rtx-pro-6000-pcie
    description: GLM-5.3 (744B) on six 96-GB RTX PRO GPUs with TP6 and MTP3 from the model's built-in layer, serving the FP4-CSF checkpoint GLM-5.3-NVFP4-CSF. TP6 pads the attention heads to 66 and the expert channels to 2112 (352 per GPU) with zero weights. About 228K KV tokens at 94% of GPU memory; DCP=2 doubles that to about 452K at about 17% fewer decode steps, DCP=3 triples it to about 678K, and DCP=6 holds the full 1M context (about 1.36M tokens) at about two thirds of the DCP1 decode speed. VRAM prefix cache only.
    options:
      model: local-inference-lab/GLM-5.3-NVFP4-CSF
      revision: a4d406932f2db96db8e852867c7939f448e0cd6f
      quantization: nvfp4_csf
      load-format: nvfp4_csf
      tensor-parallel-size: 6
      # Six GPUs leave less memory for activations: a 4,096-token prefill
      # budget and 16 request slots. At 95% the first DCP=2 prefill runs out
      # of memory in the indexer's top-k exchange.
      gpu-memory-utilization: 0.94
      max-num-batched-tokens: 4096
      max-num-seqs: 16
    environment:
      # DCP=2 exchanges queries and attention outputs over B12X PCIe.
      VLLM_USE_B12X_DCP_A2A: "1"
      # The DCP groups' small decode exchanges run on NCCL: two channels
      # decode 2-3% faster at DCP=2 than the profile's sixteen and leave
      # memory for the 94% budget.
      NCCL_MIN_NCHANNELS: "2"
      NCCL_MAX_NCHANNELS: "2"
      NCCL_BUFFSIZE: "4194304"
    modes: {}
    linked_options: {}
  glm53-tp3:
    profile: glm53-flash
    hardware: rtx-pro-6000-pcie
    description: GLM-5.3-Flash on three 96-GB RTX PRO GPUs with TP3, expert parallelism and MTP3. Attention heads are padded for TP3, the vision tower runs data-parallel, and large dense projections decode in FP8. VRAM prefix cache only.
    options:
      # FP4-CSF experts need B12X without expert parallelism.
      checkpoint: original
      tensor-parallel-size: 3
      enable-expert-parallel: true
      moe-backend: flashinfer_cutlass
      enable-flashinfer-autotune: true
      mode: mtp
      max-num-seqs: 8
      max-cudagraph-capture-size: 32
      cudagraph-capture-sizes: [1, 2, 4, 8, 12, 16, 20, 24, 28, 32]
      additional-config: {glm53_kda_decode_backend: b12x, kda_prefill_backend: flashkda}
    environment:
      VLLM_PCIE_ONESHOT_ALLREDUCE_MAX_SIZE: 256KB
      VLLM_GLM53_L2_PREFETCH_BUDGET_A_MB: "10"
      VLLM_GLM53_L2_PREFETCH_BUDGET_B_MB: "25"
      VLLM_GLM53_L2_PREFETCH_BUDGET_C_MB: "7.5"
      VLLM_GLM53_L2_PREFETCH_BUDGET_A_MLA_MB: "18"
      VLLM_GLM53_FP8_DENSE: "1"
      VLLM_GLM53_FP8_PREFILL: w8a8
    modes: {}
    linked_options: {}
  qwen38-tp2:
    profile: qwen38-flash-next
    hardware: rtx-pro-6000-pcie
    description: Qwen3.8 Flash Next on two GPUs, retaining the model profile's MTP, table-offload and attention defaults.
    options:
      tensor-parallel-size: 2
    environment: {}
    modes: {}
    linked_options: {}
  qwen38-tp1x2:
    profile: qwen38-flash-next
    hardware: rtx-pro-6000-pcie
    description: Qwen3.8 Flash Next as two TP1 replicas on two GPUs behind one endpoint that keeps each conversation on one replica. The replicas share one host-RAM PLE table and, with an external cache, one LMCache service.
    options:
      replicas: 2
    environment: {}
    modes: {}
    linked_options: {}
  mimo26-flash-tp2:
    profile: mimo26-flash
    hardware: rtx-pro-6000-pcie
    description: MiMo-V2.6-Flash-RL on two 96-GB RTX PRO GPUs with DFlash 7 and adaptive verification, FP8 KV and the full 1M context. Images and audio work; video input is off because its encoder profile would take most of the KV cache at TP2.
    options:
      tensor-parallel-size: 2
      gpu-memory-utilization: 0.985
      limit-mm-per-prompt: {video: 0}
    environment: {}
    modes: {}
    linked_options: {}
  glm53-dgx-spark-x2:
    profile: glm53-flash
    hardware: dgx-spark
    description: GLM-5.3-Flash on two DGX Spark (GB10) boxes, one tensor-parallel group over their RoCE link (TP2, two nodes). It serves GLM-5.3-Flash-NVFP4-Spark, whose MTP experts are NVFP4 and run on B12X, with MTP3, eight request slots and the prefix cache in GPU memory. Run one container per box with NODE_RANK 0 and 1 and MASTER_ADDR set to the rank-0 box's RoCE address; rank 0 serves the API. On the 4x GB10 test cluster it held 351,730 KV tokens and decoded about 30 tokens/s for one request. Research-only.
    options:
      model: local-inference-lab/GLM-5.3-Flash-NVFP4-Spark
      quantization: modelopt_mixed
      served-model-name: GLM-5.3-Flash
      tensor-parallel-size: 2
      nnodes: 2
      mode: mtp
      max-model-len: -1
      max-num-seqs: 8
      max-num-batched-tokens: 4096
      # 87.9 GiB of weights per box; 0.83 leaves room for the worker, engine
      # and API processes in the same 128 GB (about 7 GB stayed free on rank 0).
      gpu-memory-utilization: 0.83
      max-cudagraph-capture-size: auto
      cudagraph-capture-sizes: [1, 2, 4, 8, 12, 16, 20, 24, 28, 32]
      # The Spark checkpoint's experts lose accuracy with NVFP4 prefill rows.
      prefill-activations: a16
      cache-mode: vram
    environment: {}
    modes:
      mtp:
        config: {moe_backend: b12x}
    linked_options: {}
  qwen38-dgx-spark-x2:
    profile: qwen38-flash-next
    hardware: dgx-spark
    description: Qwen3.8 Flash Next on two DGX Spark (GB10) boxes, one tensor-parallel group over their RoCE link (TP2, two nodes), from the ModelOpt NVFP4 checkpoint. Run one container per box with NODE_RANK 0 and 1 and MASTER_ADDR set to the rank-0 box's RoCE address; rank 0 serves the API. On the 4x GB10 test cluster it held 3.39M KV tokens and decoded about 50 tokens/s for one request. One box cannot hold the 100 GiB of weights with the serving processes. Research-only.
    options:
      checkpoint: original
      tensor-parallel-size: 2
      nnodes: 2
      max-num-seqs: 16
      gpu-memory-utilization: 0.75
      cache-mode: vram
    environment: {}
    modes: {}
    linked_options: {}
